[package]
name = "promptsaver"
version = "0.1.2"
description = "Simpan, atur, dan pakai ulang prompt AI secara offline"
authors = ["M. Ikhsan Pasaribu"]
edition = "2021"

[lib]
# Nama `_lib` diperlukan supaya tidak bentrok dengan nama biner, khususnya di Windows.
name = "promptsaver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-clipboard-manager = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tauri-plugin-biometric = "2.4.1"

# Plugin khusus desktop. Mobile tidak punya tray, pintasan global, dan jendela tunggal.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

# Anggaran keringanan dari AGENTS.md Bagian 4. Jangan dinaikkan tanpa keputusan pemilik proyek.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
# Kompilasi dev lebih cepat dengan optimasi dasar, tetap di bawah batas debug yang berguna.
opt-level = 0
